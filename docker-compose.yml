name: claude-analytics

# Ports are published on loopback only. Set BIND_ADDRESS=0.0.0.0 to expose them, and
# then also set GRAFANA_ANONYMOUS=false, a real admin password, put Loki behind auth, and
# keep the unauthenticated OTLP ports private. See docs/operating-the-stack.mdx.

services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./stack/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    command: -config.file=/etc/tempo/config.yaml
    user: "0"
    volumes:
      - ./stack/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  mimir:
    image: grafana/mimir:2.15.0
    command: -config.file=/etc/mimir/config.yaml
    volumes:
      - ./stack/mimir.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data
    restart: unless-stopped

  # OTLP entrypoint, so Claude Code's native OpenTelemetry export can land in the same stack.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: --config=/etc/otelcol/config.yaml
    volumes:
      - ./stack/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on: [loki, tempo, mimir]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claude-code-usage.json
    volumes:
      - ./stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./stack/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3030}:3000"
    depends_on: [loki, tempo, mimir]
    restart: unless-stopped

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
