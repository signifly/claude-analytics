version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The docs site's dependencies. The plugin has none.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # fumadocs-mdx and -ui pin the fumadocs-core they work with: bumped alone, the docs build breaks.
      fumadocs:
        patterns: ["fumadocs-*"]
