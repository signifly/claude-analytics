name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, whatever the repository default: this workflow runs fork PRs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [18, 22]
        include:
          # The lock and buffer lean on OS behaviour (hard links, mtimes, signals), and the team is on Macs.
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; version comes from packageManager in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # turbo run check
      - run: pnpm test # turbo run test test:root
      - run: pnpm build # turbo run build (the docs app needs Node 20.9+, as Next.js does)
        if: matrix.node != 18

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/usage-analytics/.claude-plugin/plugin.json \
                   plugins/usage-analytics/hooks/hooks.json examples/project-settings.json examples/managed-settings.json \
                   stack/grafana/dashboards/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || exit 1
          done
      - name: Plugin and marketplace manifests validate
        run: npx -y @anthropic-ai/claude-code@2.1.277 plugin validate . # pinned: bump deliberately
      - run: docker compose config -q
      - name: Start Loki
        run: |
          docker compose up -d loki
          timeout 90 sh -c 'until curl -sf http://localhost:3100/ready; do sleep 2; done'
      - name: Hook to Loki smoke test
        run: node --test test/smoke.test.mjs
        env:
          SMOKE_LOKI_URL: http://localhost:3100
      - if: failure()
        run: docker compose logs loki | tail -50
